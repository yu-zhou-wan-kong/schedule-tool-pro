<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>排班日历 · 宇宙万空</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f0f2f5;
            padding: 50px 8px 0 8px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 14px 10px 4px 10px;
            margin-bottom: 0;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2d3d;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        h1 small {
            font-size: 10px;
            font-weight: 400;
            color: #5e7a99;
            background: #edf4fa;
            padding: 2px 6px;
            border-radius: 16px;
            white-space: nowrap;
        }
        .today-btn {
            background: linear-gradient(135deg, #ff9500, #ff6b00);
            color: #fff;
            border: none;
            font-weight: 600;
            padding: 8px 40px;
            border-radius: 30px;
            font-size: 16px;
            min-width: 200px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 149, 0, 0.3);
            transition: all 0.2s ease;
        }
        .today-btn:hover {
            background: linear-gradient(135deg, #ff7b00, #e05e00);
            box-shadow: 0 6px 18px rgba(255, 149, 0, 0.45);
            transform: translateY(-1px);
        }
        .today-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(255, 149, 0, 0.3);
        }
        .settings-btn {
            background: #fff;
            border: 1.5px solid #b8ccdd;
            color: #2c5779;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            min-height: 30px;
            cursor: pointer;
        }
        .selector-panel {
            display: flex;
            flex-direction: row;
            gap: 8px;
            background: #f9fcff;
            padding: 8px 8px;
            border-radius: 18px;
            margin-bottom: 14px;
            border: 1px solid #d4e2f0;
            align-items: flex-end;
        }
        .select-group {
            flex: 1;
            min-width: 0;
        }
        .select-group label {
            font-size: 10px;
            color: #2c3e50;
            margin-bottom: 2px;
            display: block;
        }
        .select-group select,
        .select-group input {
            width: 100%;
            padding: 5px 8px;
            border: 1.5px solid #d9e2ec;
            border-radius: 20px;
            font-size: 12px;
            min-height: 34px;
            background: #fff;
        }
        .calendar-wrapper {
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .calendar-table th {
            padding: 6px 2px;
            font-size: 11px;
            color: #1e3b5c;
            border-bottom: 2px solid #cbd6e4;
            font-weight: 600;
        }
        .calendar-table td {
            border: 1px solid #ecf3fa;
            text-align: center;
            padding: 10px 1px;
            font-size: 11px;
            width: 14.28%;
            cursor: pointer;
            transition: background .1s;
        }
        .calendar-table td:hover {
            background: #f0f8ff;
        }
        .date-num {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex-wrap: wrap;
        }
        .schedule-badge {
            display: inline-block;
            padding: 2px 3px;
            border-radius: 12px;
            font-size: 12px;
            min-width: 36px;
        }
        .badge-work {
            background: #e2f0ff;
            color: #0057b3;
        }
        .badge-day {
            background: #e6f7e6;
            color: #1e7a1e;
        }
        .badge-night {
            background: #e3eafc;
            color: #283593;
        }
        .badge-rest {
            background: #f2f2f2;
            color: #6c757d;
        }
        .today-highlight {
            background: #fff7e6;
            border-radius: 4px;
        }
        .today-highlight .date-num {
            color: #d45a00;
        }
        .calendar-table td.selected {
            background-color: #b8d9ff;
        }
        .today-tag {
            font-size: 10px;
            background: #ff9500;
            color: #fff;
            padding: 0 3px;
            border-radius: 6px;
            line-height: 1.2;
        }
        .holiday-tag {
            display: inline-block;
            background: #ff6b6b;
            color: #fff;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 4px;
            margin-left: 2px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .workday-tag {
            display: inline-block;
            background: #4a90d9;
            color: #fff;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 4px;
            margin-left: 2px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .triple-pay-tag {
            display: inline-block;
            color: #ff6b00;
            font-size: 9px;
            font-weight: 700;
            margin-left: 1px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .holiday-status {
            font-size: 10px;
            margin-top: 10px;
            padding: 6px;
            border-radius: 12px;
            background: #f0f7ff;
            color: #2c5779;
            text-align: center;
            display: none;
        }
        .holiday-status.success {
            background: #e6f7e6;
            color: #1e7a1e;
        }
        .other-values {
            margin-top: 12px;
            padding: 10px 8px;
            background: #f9fcff;
            border-radius: 18px;
            border: 1px solid #d4e2f0;
        }
        .other-title {
            font-size: 11px;
            color: #2c5779;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: left;
            padding-left: 4px;
        }
        .other-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: space-around;
        }
        .other-item {
            flex: 1 0 auto;
            min-width: 50px;
            background: #fff;
            border-radius: 16px;
            padding: 6px 2px;
            text-align: center;
            border: 1px solid #d4e2f0;
        }
        .other-value-name {
            font-size: 12px;
            font-weight: 600;
            color: #1e3b5c;
        }
        .other-schedule {
            font-size: 13px;
            padding: 4px 3px;
            border-radius: 12px;
            margin-top: 2px;
            white-space: nowrap;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 10px;
        }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 18px 14px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-card h3 {
            font-size: 16px;
            color: #1f2d3d;
            margin-bottom: 4px;
        }
        .modal-card .setting-hint {
            background: #e8f0fe;
            padding: 8px 10px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 12px;
            color: #2c5779;
            line-height: 1.5;
        }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f3f9ff;
            padding: 7px 10px;
            border-radius: 24px;
            margin-bottom: 8px;
        }
        .setting-row label {
            min-width: 28px;
            font-size: 13px;
            font-weight: 600;
            color: #1f4970;
            white-space: nowrap;
        }
        .setting-row select,
        .setting-row input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid #c2d6e8;
            background: #fff;
            font-size: 13px;
            min-width: 0;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 12px;
        }
        .preview-table th {
            background: #e8f0fe;
            padding: 6px 4px;
            border: 1px solid #cbd6e4;
            font-weight: 600;
            color: #1e3b5c;
            font-size: 11px;
        }
        .preview-table td {
            padding: 6px 4px;
            border: 1px solid #d4e2f0;
            text-align: center;
            font-size: 12px;
            color: #1f2d3d;
        }
        .preview-table .val-name {
            font-weight: 600;
            color: #1f4970;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .save-btn,
        .cancel-btn {
            flex: 1;
            padding: 8px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .save-btn {
            background: #0077ff;
            color: #fff;
            border: none;
        }
        .cancel-btn {
            background: transparent;
            border: 1.5px solid #a1b9cf;
            color: #2c5779;
        }
        .default-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fefaf0;
            padding: 7px 10px;
            border-radius: 24px;
            margin-bottom: 8px;
            border: 1px solid #f0d88a;
        }
        .default-row label {
            min-width: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #7a5d00;
            white-space: nowrap;
        }
        .default-row select {
            flex: 1;
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid #d9c56e;
            background: #fff;
            font-size: 13px;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            background: #f9fcff;
            padding: 5px 8px;
            border-radius: 18px;
        }
        .color-row label {
            min-width: 36px;
            font-size: 13px;
            font-weight: 600;
            color: #1f4970;
        }
        .color-row input[type="color"] {
            width: 36px;
            height: 30px;
            padding: 2px;
            border: 1px solid #c2d6e8;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }
        .color-preview {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 4px;
        }
        details summary {
            font-size: 14px;
            font-weight: 600;
            color: #1f4970;
            cursor: pointer;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🗓️ 排班日历</h1>
            <div>
                <button class="settings-btn" onclick="openSettingsModal()">设置</button>
            </div>
        </div>
        <div class="selector-panel">
            <div class="select-group">
                <label>👥 运行值</label>
                <select id="scheduleValue">
                    <option value="1">一值</option>
                    <option value="2">二值</option>
                    <option value="3">三值</option>
                    <option value="4">四值</option>
                    <option value="5">五值</option>
                </select>
            </div>
            <div class="select-group">
                <label>📆 选择月份</label>
                <input type="month" id="monthPicker" value="2026-04">
            </div>
        </div>
        <div class="calendar-wrapper">
            <table class="calendar-table" id="calendarTable">
                <thead>
                    <tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>
        <div id="holidayStatus" class="holiday-status"></div>
        <div style="text-align: center; margin: 10px 0;">
            <button class="today-btn" onclick="goToToday()">今天</button>
        </div>
        <div class="other-values">
            <div class="other-title" id="selectedDateTitle">📅 所选日期排班</div>
            <div class="other-grid" id="otherValuesGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal" onclick="if(event.target===this) closeSettingsModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3>📌 排班基准设置</h3>

            <details id="baseSettingsDetails">
                <summary>⚙️ 基准日期与班次（展开设置）</summary>
                <div class="setting-hint">
                    💡 选择<strong>任意一个值</strong>、<strong>任意一个班次</strong>及其<strong>日期</strong>，系统自动推算所有五个值的完整排班。每个值之间间隔<strong>2天</strong>。
                </div>
                <div class="setting-row">
                    <label>👥 值</label>
                    <select id="settingValueSelect" onchange="onSettingValueChange()">
                        <option value="1">一值</option>
                        <option value="2">二值</option>
                        <option value="3">三值</option>
                        <option value="4">四值</option>
                        <option value="5">五值</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>🔄 班次</label>
                    <select id="settingShiftSelect" onchange="onSettingShiftChange()">
                        <option value="1">中班①</option>
                        <option value="2">中班②</option>
                        <option value="3">中休</option>
                        <option value="4">白班①</option>
                        <option value="5">白班②</option>
                        <option value="6">白休</option>
                        <option value="7">零点①</option>
                        <option value="8">零点②</option>
                        <option value="9">大休①</option>
                        <option value="10">大休②</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>📅 日期</label>
                    <input type="date" id="settingDateInput" onchange="onSettingDateChange()">
                </div>
                <div class="setting-hint" style="background:#f0f7e6;color:#1e7a1e;">
                    📋 <strong>预览推算结果</strong>（各值「中班①」日期）
                </div>
                <table class="preview-table" id="settingPreviewTable">
                    <thead>
                        <tr><th>一值</th><th>二值</th><th>三值</th><th>四值</th><th>五值</th></tr>
                    </thead>
                    <tbody>
                        <tr id="settingPreviewRow">
                            <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                        </tr>
                    </tbody>
                </table>
            </details>

            <!-- 默认显示值 移出折叠区域 -->
            <div class="default-row" style="margin-top: 12px;">
                <label>⭐ 默认显示值</label>
                <select id="defaultValueSelect">
                    <option value="1">一值</option>
                    <option value="2">二值</option>
                    <option value="3">三值</option>
                    <option value="4">四值</option>
                    <option value="5">五值</option>
                </select>
            </div>

            <div class="setting-hint" style="background:#fefaf0;color:#7a5d00; margin-top:12px;">🎨 自定义班次颜色</div>
            <div id="colorSettingsContainer">
                <!-- 动态生成颜色设置行 -->
            </div>
            <button type="button" onclick="resetColors()" style="margin-top:6px; font-size:12px; padding:4px 12px; border-radius:16px; border:1px solid #ccc; background:#fff; cursor:pointer;">恢复默认颜色</button>

            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeSettingsModal()">取消</button>
                <button class="save-btn" onclick="saveAllBaseDates()">💾 保存</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const CONFIG = {
                CYCLE_OFFSET: 6,
                PRESET_BASE4_ZERO: '2026-03-14',
                STORAGE_KEY: 'schCfg',
                DEFAULT_VALUE_KEY: 'defVal',
                COLOR_STORAGE_KEY: 'schColor'
            };

            const DEFAULT_COLORS = {
                '中班': { bg: '#e2f0ff', text: '#0057b3' },
                '白班': { bg: '#e6f7e6', text: '#1e7a1e' },
                '零点': { bg: '#e3eafc', text: '#283593' },
                '休息': { bg: '#f2f2f2', text: '#6c757d' }
            };

            const H_BY_Y = {
                2026: {
                    holidays: {
                        '2026-01-01': { name: '元旦', isHoliday: true, triplePay: true },
                        '2026-01-02': { name: '元旦', isHoliday: true, triplePay: false },
                        '2026-01-03': { name: '元旦', isHoliday: true, triplePay: false },
                        '2026-02-15': { name: '春节', isHoliday: true, triplePay: false },
                        '2026-02-16': { name: '除夕', isHoliday: true, triplePay: true },
                        '2026-02-17': { name: '春节', isHoliday: true, triplePay: true },
                        '2026-02-18': { name: '春节', isHoliday: true, triplePay: true },
                        '2026-02-19': { name: '春节', isHoliday: true, triplePay: true },
                        '2026-02-20': { name: '春节', isHoliday: true, triplePay: false },
                        '2026-02-21': { name: '春节', isHoliday: true, triplePay: false },
                        '2026-02-22': { name: '春节', isHoliday: true, triplePay: false },
                        '2026-02-23': { name: '春节', isHoliday: true, triplePay: false },
                        '2026-04-04': { name: '清明节', isHoliday: true, triplePay: false },
                        '2026-04-05': { name: '清明节', isHoliday: true, triplePay: true },
                        '2026-04-06': { name: '清明节', isHoliday: true, triplePay: false },
                        '2026-05-01': { name: '劳动节', isHoliday: true, triplePay: true },
                        '2026-05-02': { name: '劳动节', isHoliday: true, triplePay: true },
                        '2026-05-03': { name: '劳动节', isHoliday: true, triplePay: false },
                        '2026-05-04': { name: '劳动节', isHoliday: true, triplePay: false },
                        '2026-05-05': { name: '劳动节', isHoliday: true, triplePay: false },
                        '2026-06-19': { name: '端午节', isHoliday: true, triplePay: true },
                        '2026-06-20': { name: '端午节', isHoliday: true, triplePay: false },
                        '2026-06-21': { name: '端午节', isHoliday: true, triplePay: false },
                        '2026-09-25': { name: '中秋节', isHoliday: true, triplePay: true },
                        '2026-09-26': { name: '中秋节', isHoliday: true, triplePay: false },
                        '2026-09-27': { name: '中秋节', isHoliday: true, triplePay: false },
                        '2026-10-01': { name: '国庆节', isHoliday: true, triplePay: true },
                        '2026-10-02': { name: '国庆节', isHoliday: true, triplePay: true },
                        '2026-10-03': { name: '国庆节', isHoliday: true, triplePay: true },
                        '2026-10-04': { name: '国庆节', isHoliday: true, triplePay: false },
                        '2026-10-05': { name: '国庆节', isHoliday: true, triplePay: false },
                        '2026-10-06': { name: '国庆节', isHoliday: true, triplePay: false },
                        '2026-10-07': { name: '国庆节', isHoliday: true, triplePay: false }
                    },
                    workdays: {
                        '2026-01-04': '元旦调休',
                        '2026-02-14': '春节调休',
                        '2026-02-28': '春节调休',
                        '2026-05-09': '劳动节调休',
                        '2026-09-20': '国庆节调休',
                        '2026-10-10': '国庆节调休'
                    }
                }
            };

            function gYH() {
                let y = new Date().getFullYear();
                return H_BY_Y[y] || H_BY_Y[2026];
            }
            function bHM(d) {
                let m = {};
                for (let [k, v] of Object.entries(d.holidays)) m[k] = v;
                for (let [k, v] of Object.entries(d.workdays)) m[k] = { name: v, isHoliday: false, isWorkday: true };
                return m;
            }

            let holidayMap = {}, baseDateConfig = {}, selectedDateStr = '', scheduleColors = { ...DEFAULT_COLORS };
            const yearData = gYH();
            holidayMap = bHM(yearData);

            function loadColorConfig() {
                try {
                    let s = localStorage.getItem(CONFIG.COLOR_STORAGE_KEY);
                    if (s) return { ...DEFAULT_COLORS, ...JSON.parse(s) };
                } catch (e) {}
                return { ...DEFAULT_COLORS };
            }
            function saveColorConfig(c) {
                localStorage.setItem(CONFIG.COLOR_STORAGE_KEY, JSON.stringify(c));
            }
            function getColorForSchedule(s) {
                return scheduleColors[s] || scheduleColors['休息'] || DEFAULT_COLORS['休息'];
            }

            function calcBase1FromBase4(d) {
                let nd = new Date(d);
                nd.setDate(nd.getDate() - 6);
                return `${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, '0')}-${String(nd.getDate()).padStart(2, '0')}`;
            }
            const DEFAULT_BASE1_ZERO = calcBase1FromBase4(CONFIG.PRESET_BASE4_ZERO);

            function genConfig(b1) {
                let d = new Date(b1), cfg = {};
                for (let v = 1; v <= 5; v++) {
                    let t = new Date(d);
                    t.setDate(d.getDate() + (v - 1) * 2);
                    cfg[v] = {
                        date: `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`,
                        cycleOffset: CONFIG.CYCLE_OFFSET
                    };
                }
                return cfg;
            }
            function loadConfig() {
                try {
                    let s = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (s) return JSON.parse(s);
                } catch (e) {}
                return genConfig(DEFAULT_BASE1_ZERO);
            }
            function saveConfig(c) {
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(c));
            }
            baseDateConfig = loadConfig();

            function getSch(dateStr, vi) {
                let bd = new Date(baseDateConfig[vi].date), td = new Date(dateStr);
                let diff = Math.floor((td - bd) / 86400000);
                let pos = ((CONFIG.CYCLE_OFFSET + diff) % 10 + 10) % 10 + 1;
                let sn = '休息';
                if (pos === 1 || pos === 2) sn = '中班';
                else if (pos === 4 || pos === 5) sn = '白班';
                else if (pos === 7 || pos === 8) sn = '零点';
                return { schedule: sn, cyclePos: pos };
            }

            function todayStr() {
                let n = new Date();
                return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
            }

            const statusEl = document.getElementById('holidayStatus');
            function updateHolidayStatus() {
                if (statusEl) {
                    statusEl.innerText = '';
                    statusEl.className = '';
                }
            }

            function updateOtherValues(ds) {
                let grid = document.getElementById('otherValuesGrid');
                let cv = document.getElementById('scheduleValue').value;
                let title = document.getElementById('selectedDateTitle');
                if (ds) {
                    let [y, m, d] = ds.split('-');
                    title.innerText = `📅 ${y}年${parseInt(m)}月${parseInt(d)}日 排班`;
                }
                let hi = holidayMap[ds], ex = '';
                if (hi && hi.isHoliday) {
                    ex = ` 🏖️${hi.name}`;
                    if (hi.triplePay) ex += ' | 💰3倍工资日';
                } else if (hi && hi.isWorkday) ex = ' 🔧调休上班日';
                if (ex) title.innerText += ex;

                let html = '';
                for (let v = 1; v <= 5; v++) {
                    let { schedule, cyclePos } = getSch(ds, v);
                    let label = '';
                    if (schedule === '中班') label = `中班 ${cyclePos === 1 ? '①' : '②'}`;
                    else if (schedule === '白班') label = `白班 ${cyclePos === 4 ? '①' : '②'}`;
                    else if (schedule === '零点') label = `零点 ${cyclePos === 7 ? '①' : '②'}`;
                    else if (cyclePos === 3) label = '中休';
                    else if (cyclePos === 6) label = '白休';
                    else if (cyclePos === 9) label = '大休①';
                    else if (cyclePos === 10) label = '大休②';
                    else label = '休';

                    let col = getColorForSchedule(schedule);
                    let act = v == cv;
                    html += `<div class="other-item"${act ? ' style="border:2px solid #ff9500"' : ''}><div class="other-value-name">${v}值</div><div class="other-schedule" style="background:${col.bg};color:${col.text}">${label}</div></div>`;
                }
                grid.innerHTML = html;
            }

            function renderCal() {
                let cv = document.getElementById('scheduleValue').value;
                let mp = document.getElementById('monthPicker');
                let [y, m] = mp.value.split('-').map(Number);
                let ts = todayStr();

                if (!selectedDateStr || !selectedDateStr.startsWith(`${y}-${String(m).padStart(2, '0')}`)) {
                    if (selectedDateStr) {
                        let [, , sd] = selectedDateStr.split('-').map(Number);
                        let md = new Date(y, m, 0).getDate();
                        selectedDateStr = `${y}-${String(m).padStart(2, '0')}-${String(Math.min(sd, md)).padStart(2, '0')}`;
                    } else {
                        selectedDateStr = ts.startsWith(`${y}-${m}`) ? ts : `${y}-${String(m).padStart(2, '0')}-01`;
                    }
                }

                let fd = new Date(y, m - 1, 1), ld = new Date(y, m, 0);
                let dim = ld.getDate();
                let startDow = fd.getDay() || 7;
                let lead = startDow - 1;
                let rows = [], dc = 1;

                for (let r = 0; r < 6; r++) {
                    let row = [];
                    for (let c = 0; c < 7; c++) {
                        if (r === 0 && c < lead) row.push({ day: 0 });
                        else if (dc <= dim) {
                            row.push({ day: dc, dateStr: `${y}-${String(m).padStart(2, '0')}-${String(dc).padStart(2, '0')}` });
                            dc++;
                        } else row.push({ day: 0 });
                    }
                    rows.push(row);
                    if (dc > dim) break;
                }

                let tbody = document.getElementById('calendarBody');
                let th = '';
                rows.forEach(row => {
                    th += '<tr>';
                    row.forEach(cell => {
                        if (cell.day === 0) {
                            th += '<td style="background:#fafcfe"></td>';
                        } else {
                            let { schedule } = getSch(cell.dateStr, cv);
                            let col = getColorForSchedule(schedule);
                            let isT = cell.dateStr === ts, isS = cell.dateStr === selectedDateStr;
                            let tc = isT ? 'today-highlight' : '', sc = isS ? 'selected' : '';
                            let tags = '';
                            let hi = holidayMap[cell.dateStr];
                            if (hi && hi.isHoliday) {
                                if (hi.triplePay) tags += `<span class="holiday-tag" title="${hi.name}">${hi.name.length > 2 ? hi.name.substring(0, 2) : hi.name}</span>`;
                                else tags += `<span class="holiday-tag" title="${hi.name}">休</span>`;
                            }
                            if (hi && hi.isWorkday) tags += `<span class="workday-tag" title="${hi.name}">班</span>`;
                            if (hi && hi.triplePay && (schedule === '中班' || schedule === '白班' || schedule === '零点')) tags += `<span class="triple-pay-tag">🧧×3</span>`;

                            th += `<td class="${tc} ${sc}" onclick="selectDate('${cell.dateStr}')"><div class="date-num">${cell.day}${isT ? '<span class="today-tag">今</span>' : ''} ${tags}</div><div class="schedule-badge" style="background:${col.bg};color:${col.text}">${schedule}</div></td>`;
                        }
                    });
                    th += '</tr>';
                });
                tbody.innerHTML = th;
                updateOtherValues(selectedDateStr);
            }

            window.selectDate = function(ds) {
                selectedDateStr = ds;
                renderCal();
            };
            window.goToToday = function() {
                let n = new Date();
                let y = n.getFullYear(), m = String(n.getMonth() + 1).padStart(2, '0'), d = String(n.getDate()).padStart(2, '0');
                selectedDateStr = `${y}-${m}-${d}`;
                document.getElementById('monthPicker').value = `${y}-${m}`;
                renderCal();
            };

            let _settingTempBase1ZeroDate = '';
            function dateAddDays(ds, days) {
                let d = new Date(ds);
                d.setDate(d.getDate() + days);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }
            function updatePreview() {
                let row = document.getElementById('settingPreviewRow');
                if (!row) return;
                let cells = '';
                for (let v = 1; v <= 5; v++) {
                    let md = dateAddDays(_settingTempBase1ZeroDate, (v - 1) * 2 - 6);
                    cells += `<td><span class="val-name">${v}值</span><br><span style="font-size:11px;color:#555">${md}</span></td>`;
                }
                row.innerHTML = cells;
            }
            function syncDate() {
                let vs = document.getElementById('settingValueSelect'), ss = document.getElementById('settingShiftSelect'), di = document.getElementById('settingDateInput');
                if (!vs || !ss || !di) return;
                let v = parseInt(vs.value), p = parseInt(ss.value);
                di.value = dateAddDays(_settingTempBase1ZeroDate, (v - 1) * 2 + (p - 7));
            }

            window.onSettingValueChange = function() { syncDate(); updatePreview(); };
            window.onSettingShiftChange = function() { syncDate(); updatePreview(); };
            window.onSettingDateChange = function() {
                let vs = document.getElementById('settingValueSelect'), ss = document.getElementById('settingShiftSelect'), di = document.getElementById('settingDateInput');
                if (!vs || !ss || !di) return;
                let v = parseInt(vs.value), p = parseInt(ss.value), D = di.value;
                if (!D) return;
                _settingTempBase1ZeroDate = dateAddDays(D, -((v - 1) * 2 + (p - 7)));
                updatePreview();
            };

            function renderColorSettings() {
                let c = document.getElementById('colorSettingsContainer');
                if (!c) return;
                let h = '';
                for (let [s, cl] of Object.entries(scheduleColors)) {
                    h += `<div class="color-row"><label>${s}</label><span style="font-size:12px;margin-right:2px">背景</span><input type="color" value="${cl.bg}" data-shift="${s}" data-type="bg" onchange="updateColorPreview(this)"><span style="font-size:12px;margin-right:2px">字体</span><input type="color" value="${cl.text}" data-shift="${s}" data-type="text" onchange="updateColorPreview(this)"><span class="color-preview" id="colorPreview-${s}" style="background:${cl.bg};color:${cl.text}">${s}</span></div>`;
                }
                c.innerHTML = h;
            }
            window.updateColorPreview = function(inp) {
                let s = inp.dataset.shift, t = inp.dataset.type;
                let p = document.getElementById('colorPreview-' + s);
                if (!p) return;
                if (t === 'bg') p.style.background = inp.value;
                else p.style.color = inp.value;
            };
            window.resetColors = function() {
                scheduleColors = { ...DEFAULT_COLORS };
                renderColorSettings();
            };

            window.openSettingsModal = function() {
                _settingTempBase1ZeroDate = baseDateConfig[1].date;
                document.getElementById('settingValueSelect').value = '1';
                document.getElementById('settingShiftSelect').value = '7';
                document.getElementById('settingDateInput').value = _settingTempBase1ZeroDate;
                let dv = document.getElementById('defaultValueSelect');
                if (dv) dv.value = localStorage.getItem(CONFIG.DEFAULT_VALUE_KEY) || '1';
                scheduleColors = loadColorConfig();
                renderColorSettings();
                updatePreview();
                document.getElementById('settingsModal').style.display = 'flex';
                document.getElementById('baseSettingsDetails').open = false;
            };
            window.closeSettingsModal = function() {
                document.getElementById('settingsModal').style.display = 'none';
            };

            window.saveAllBaseDates = function() {
                let vs = document.getElementById('settingValueSelect'), ss = document.getElementById('settingShiftSelect'), di = document.getElementById('settingDateInput'), dv = document.getElementById('defaultValueSelect');
                if (!vs || !ss || !di) { closeSettingsModal(); return; }
                let v = parseInt(vs.value), p = parseInt(ss.value), D = di.value;
                if (!D) { alert('请选择日期'); return; }
                let nb = dateAddDays(D, -((v - 1) * 2 + (p - 7)));
                baseDateConfig = genConfig(nb);
                saveConfig(baseDateConfig);
                let defVal = dv ? dv.value : '1';
                localStorage.setItem(CONFIG.DEFAULT_VALUE_KEY, defVal);
                document.getElementById('scheduleValue').value = defVal;

                let inputs = document.querySelectorAll('#colorSettingsContainer input[data-shift]');
                let nc = {};
                inputs.forEach(inp => {
                    let s = inp.dataset.shift, t = inp.dataset.type;
                    if (!nc[s]) nc[s] = {};
                    nc[s][t] = inp.value;
                });
                scheduleColors = { ...DEFAULT_COLORS, ...nc };
                saveColorConfig(scheduleColors);
                closeSettingsModal();
                renderCal();
            };

            const cw = document.querySelector('.calendar-wrapper');
            if (cw) {
                let sx, sy, sw = false;
                cw.addEventListener('touchstart', function(e) {
                    sx = e.touches[0].clientX;
                    sy = e.touches[0].clientY;
                    sw = false;
                }, { passive: true });
                cw.addEventListener('touchmove', function(e) {
                    if (sx === undefined) return;
                    let dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                        e.preventDefault();
                        sw = true;
                    }
                }, { passive: false });
                cw.addEventListener('touchend', function(e) {
                    if (sx === undefined) return;
                    let dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
                    if (sw && Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
                        let mp = document.getElementById('monthPicker');
                        let [y, m] = mp.value.split('-').map(Number);
                        if (dx < 0) { m++; if (m > 12) { m = 1; y++; } }
                        else { m--; if (m < 1) { m = 12; y--; } }
                        mp.value = `${y}-${String(m).padStart(2, '0')}`;
                        renderCal();
                    }
                    sx = undefined;
                    sw = false;
                }, { passive: true });
                cw.addEventListener('touchcancel', function() {
                    sx = undefined;
                    sw = false;
                }, { passive: true });
            }

            window.onload = function() {
                scheduleColors = loadColorConfig();
                let sv = localStorage.getItem(CONFIG.DEFAULT_VALUE_KEY);
                if (sv) document.getElementById('scheduleValue').value = sv;
                let n = new Date();
                let y = n.getFullYear(), m = String(n.getMonth() + 1).padStart(2, '0'), d = String(n.getDate()).padStart(2, '0');
                selectedDateStr = `${y}-${m}-${d}`;
                document.getElementById('monthPicker').value = `${y}-${m}`;
                renderCal();
                updateHolidayStatus();
                document.getElementById('scheduleValue').addEventListener('change', renderCal);
                document.getElementById('monthPicker').addEventListener('change', renderCal);
            };
        })();
    </script>
</body>
</html>
